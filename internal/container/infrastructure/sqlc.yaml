version: "2"
sql:
  - engine: "mysql"
    queries: "query"
    schema:
      - "../../../migration/000001_initial_schema.up.sql"
      - "../../../migration/000002_add_deployment_locks.up.sql"
      - "../../../migration/000003_add_verification_tokens.up.sql"
      - "../../../migration/000004_move_fqdn_to_networks.up.sql"
      - "../../../migration/000005_add_initial_templates.up.sql"
    gen:
      go:
        package: "sqlc"
        out: "sqlc"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        emit_exported_queries: false
        emit_result_struct_pointers: false
        overrides:
          - db_type: "char(36)"
            go_type: "string"
          - db_type: "timestamp"
            go_type: "time.Time"
          - db_type: "datetime"
            go_type: "time.Time"
