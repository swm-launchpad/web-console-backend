name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    # 매일 오전 9시 (KST) = UTC 00:00
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  GO_VERSION: '1.25.1'

jobs:
  ci:
    name: CI Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Check code formatting
        run: make fmt-check

      - name: Run go vet
        run: make vet

      - name: Run golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.4.0
          make lint

      - name: Check go mod tidy
        run: make tidy-check

      - name: Run tests
        run: make test

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ steps.app_token.outputs.token }}

      - name: Generate image metadata
        id: meta
        run: |
          # Generate image name
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/web-console-backend"
          echo "image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT

          # Generate tags based on commit hash
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          echo "commit_tag=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "full_image=${IMAGE_NAME}:${SHORT_SHA}" >> $GITHUB_OUTPUT

          # Always tag as latest since this only runs on main
          echo "latest_tag=latest" >> $GITHUB_OUTPUT
          echo "is_main=true" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.full_image }}
            ${{ steps.meta.outputs.image_name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Image build completed
        run: |
          echo "Successfully built and pushed Docker image:"
          echo "  - ${{ steps.meta.outputs.full_image }}"
          echo "  - ${{ steps.meta.outputs.image_name }}:latest"
          echo ""
          echo "Image URL: https://ghcr.io/${{ github.repository_owner }}/web-console-backend"
