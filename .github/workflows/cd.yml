name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: web-console-backend

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/web-console-backend
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Web Console Backend Service

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Image build completed
        run: |
          echo "Successfully built and pushed Docker image with tags:"
          echo "${{ steps.meta.outputs.tags }}"
          echo ""
          echo "Image URL: https://ghcr.io/${{ github.repository_owner }}/web-console-backend"
          echo "Repository will be automatically linked via OCI labels"

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          ssh-keyscan -H launchpad.kr >> ~/.ssh/known_hosts

      - name: Deploy migrations
        run: |
          # Copy migrations directory to server
          ssh ubuntu@launchpad.kr "rm -rf ~/mysql/migrations && mkdir -p ~/mysql/migrations"
          scp -r ./migrations ubuntu@launchpad.kr:~/mysql/

          # Execute migration script
          ssh ubuntu@launchpad.kr "cd ~ && sudo ./mysql/scripts/migrate.sh up"

      - name: Deploy environment file
        run: |
          # Create .env file from secret and copy to server
          echo "${{ secrets.ENV_FILE }}" > .env
          scp .env ubuntu@launchpad.kr:~/backend/.env
          ssh ubuntu@launchpad.kr "sudo chmod 0600 ~/backend/.env"
          rm .env

      - name: Deploy application
        run: |
          ssh ubuntu@launchpad.kr "cd ~ && sudo ./backend/scripts/deploy.sh latest --org swm-launchpad --repo web-console-backend --env ~/backend/.env"

      - name: Health check
        run: |
          echo "Performing health check..."
          for i in {1..30}; do
            if curl -s https://api.launchpad.kr/health | grep -q '{"database":"connected","status":"healthy"}'; then
              echo "✅ Health check passed - Application is healthy!"
              exit 0
            fi
            echo "⏳ Attempt $i/30: Waiting for application to be healthy..."
            sleep 1
          done
          echo "❌ Health check failed - Application did not become healthy within 30 seconds"
          exit 1

      - name: Deployment completed
        run: |
          echo "🚀 Deployment completed successfully!"
          echo "Application is running at: https://api.launchpad.kr"
