services:
  mysql-test:
    image: mysql:8.0
    container_name: web-console-mysql-test
    environment:
      MYSQL_ROOT_PASSWORD: ultrathink
      MYSQL_DATABASE: web_console_test
    ports:
      - "3307:3306"
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - test-network

  test-runner:
    image: golang:1.25.1
    container_name: web-console-test-runner
    environment:
      DB_HOST: mysql-test
      DB_PORT: 3306
      DB_NAME: web_console_test
      DB_USER: root
      DB_PASSWORD: ultrathink
    depends_on:
      mysql-test:
        condition: service_healthy
    command: sleep infinity
    volumes:
      - .:/app
    working_dir: /app
    networks:
      - test-network

networks:
  test-network:
    driver: bridge