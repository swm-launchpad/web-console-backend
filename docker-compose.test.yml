services:
  mysql-e2e:
    image: mysql:8.0
    container_name: web-console-mysql-test
    env_file:
      - .env.test
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-testtest}
      MYSQL_DATABASE: ${DB_NAME:-launchpad}
    ports:
      - "${DB_PORT:-3307}:3306"
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
