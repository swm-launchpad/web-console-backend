services:
  mysql-e2e:
    image: mysql:8.0
    container_name: web-console-mysql-test
    environment:
      MYSQL_ROOT_PASSWORD: test
    ports:
      - "3306:3306"
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
