version: "2"
sql:
  - engine: "mysql"
    queries: "internal/infrastructure/persistence/queries"
    schema: "migrations"
    gen:
      go:
        package: "sqlc"
        out: "internal/infrastructure/persistence/sqlc"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        emit_exported_queries: false
        emit_result_struct_pointers: true
        overrides:
          - db_type: "char(36)"
            go_type: "string"
          - db_type: "timestamp"
            go_type: "time.Time"
          - db_type: "datetime"
            go_type: "time.Time"